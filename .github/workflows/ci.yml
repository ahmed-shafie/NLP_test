name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # Banking Core runs on Postgres in deployment; raw SQL that works on SQLite
    # can still fail there (boolean vs integer, etc.), so the suite runs on both.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app banking-core tests

      - name: Format check (ruff)
        run: ruff format --check app banking-core tests

      - name: Type check (mypy)
        run: mypy app banking-core

      - name: Tests (pytest)
        run: pytest -q
        env:
          BANKING_CORE_TEST_DB_URL: postgresql+psycopg://banking:banking@localhost:5432/banking_core

      - name: NLU accuracy eval (gold set)
        run: python scripts/eval_nlu.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict || true
