# Full application stack: the NLU API (with the web client at /) plus its
# operational dependencies. One command brings it up:
#
#   docker compose up --build
#
# Then open http://localhost:8000/ (simulator) or http://localhost:8000/docs (API).
# From a phone on the same network, use http://<this-host-LAN-IP>:8000/.
#
# The ELK stack lives separately under deploy/elk/docker-compose.yml; point the
# app at it via NLU_ELASTICSEARCH_URL when running both. To enable the local LLM
# exception handler, run with the "llm" profile: docker compose --profile llm up.
services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      # Conversation sessions + Memory Brain cache. Falls back to in-memory if
      # Redis is unreachable.
      NLU_REDIS_URL: "redis://redis:6379/0"
      NLU_SESSION_BACKEND: "${NLU_SESSION_BACKEND:-redis}"
      NLU_MEMORY_CACHE_BACKEND: "${NLU_MEMORY_CACHE_BACKEND:-redis}"
      # Memory Brain durable store + conversation sessions persisted on the volume.
      NLU_MEMORY_STORE_URL: "sqlite:////home/appuser/.cache/memory_brain.db"
      # Optional local LLM exception handler (enabled by the "llm" profile).
      NLU_LLM_ENABLED: "${NLU_LLM_ENABLED:-false}"
      NLU_LLM_MODEL: "${NLU_LLM_MODEL:-ollama/qwen2.5:3b}"
      NLU_LLM_API_BASE: "${NLU_LLM_API_BASE:-http://ollama:11434}"
      # ELK is optional; the service degrades gracefully when absent.
      NLU_ELK_ENABLED: "${NLU_ELK_ENABLED:-false}"
      # Banking Core: balances, pre-flight checks and beneficiary writes.
      NLU_BANKING_CORE_ENABLED: "true"
      NLU_BANKING_CORE_URL: "http://banking-core:8100"
      # Beneficiary *reads* go straight to the same Postgres database.
      NLU_BENEFICIARY_LOOKUP_ENABLED: "true"
      NLU_BENEFICIARY_DB_URL: "postgresql+psycopg://${POSTGRES_USER:-banking}:${POSTGRES_PASSWORD:-banking}@postgres:5432/${POSTGRES_DB:-banking_core}"
    volumes:
      # Persist downloaded models (sentence-transformers, Stanza) and the Memory
      # Brain SQLite store so they survive container restarts.
      - model_cache:/home/appuser/.cache
    depends_on:
      redis:
        condition: service_started
      banking-core:
        condition: service_healthy
    restart: unless-stopped

  # Downstream core-banking stand-in. Owns the accounts / beneficiaries /
  # billers tables in Postgres; the NLU never writes to them directly.
  banking-core:
    build:
      context: ./banking-core
    ports:
      - "8100:8100"
    environment:
      BANKING_CORE_DB_URL: "postgresql+psycopg://${POSTGRES_USER:-banking}:${POSTGRES_PASSWORD:-banking}@postgres:5432/${POSTGRES_DB:-banking_core}"
      # Load the demo accounts/beneficiaries the first time only; an already
      # populated database is left untouched.
      BANKING_CORE_SEED_ON_STARTUP: "${BANKING_CORE_SEED_ON_STARTUP:-true}"
      BANKING_CORE_API_KEY: "${BANKING_CORE_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-banking}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-banking}"
      POSTGRES_DB: "${POSTGRES_DB:-banking_core}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Wait for real readiness: banking-core migrates/seeds on startup.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking} -d ${POSTGRES_DB:-banking_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Optional local LLM. Enable with: docker compose --profile llm up --build
  # then (once) pull the model: docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  model_cache:
  ollama_models:
  postgres_data:
