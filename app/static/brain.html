<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banking NLU Brain — Memory Simulator</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .content { grid-template-columns: 1.3fr 1fr; }
    button.sm { padding: 5px 10px; font-size: 12px; box-shadow: none; }
    .badge.collecting { background: rgba(217,119,6,.12); color: var(--warn); border: 1px solid rgba(217,119,6,.35); }
    .badge.confirming { background: rgba(37,99,235,.12); color: var(--brand); border: 1px solid rgba(37,99,235,.35); }
    .badge.completed { background: rgba(5,150,105,.12); color: var(--good); border: 1px solid rgba(5,150,105,.35); }
    .badge.cancelled { background: rgba(225,29,72,.12); color: var(--danger); border: 1px solid rgba(225,29,72,.35); }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .slot { background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
    .slot .k { color: var(--muted); } .slot.filled { border-color: rgba(5,150,105,.4); }
    .slot.pending { border-color: rgba(217,119,6,.6); }
    .chat { display: flex; flex-direction: column; gap: 10px; min-height: 240px; max-height: 460px; overflow-y: auto; padding: 4px; margin-bottom: 12px; }
    .msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--grad); color: #ffffff; border-bottom-right-radius: 3px; }
    .msg.bot { align-self: flex-start; background: var(--card2); border: 1px solid var(--line); border-bottom-left-radius: 3px; box-shadow: 0 4px 14px rgba(30,58,95,.06); }
    .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .msg.user .meta { color: rgba(255,255,255,.82); }
    .msg .flag { text-decoration: line-through; text-decoration-color: var(--danger); color: var(--danger); font-weight: 600; }
    .item { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .item .name { font-weight: 600; color: var(--purple); }
    .ok { color: var(--good); font-size: 13px; margin-top: 8px; }
    hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
    @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="rail">
      <a class="logo" href="/assistant" title="Home">N</a>
      <div class="nav">
        <a class="ic" title="Assistant" href="/assistant">💬</a>
        <a class="ic active" title="Brain" href="/brain">🧠</a>
        <a class="ic" title="NLU Sandbox" href="/">🧪</a>
        <a class="ic" title="Insights" href="/brain/monitor">📊</a>
        <a class="ic" title="Learning" href="/active-learning">🎓</a>
        <a class="ic" title="Connections" href="/admin">🔗</a>
        <a class="ic" title="Audit" href="/admin/audit">🛡️</a>
      </div>
      <div class="me" title="user"></div>
    </div>
    <div class="main">
      <div class="top">
        <div class="av">🧠</div>
        <div><div class="ttl">Memory Brain</div><div class="sub">Chat &amp; shape its memory · EN/AR</div></div>
        <div class="pill" style="margin-left:auto"><span id="healthDot" class="dot"></span><span id="healthText">checking…</span></div>
      </div>

  <main class="content">
    <!-- Conversation -->
    <section class="card">
      <h2>Conversation <span class="ep">POST /conversation/text</span></h2>
      <div class="row">
        <div>
          <label for="userId">User id (scopes the Memory Brain)</label>
          <input type="text" id="userId" value="demo" />
        </div>
        <div style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="ghost" id="newSession">New session</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap">
        <span class="muted" style="font-size:12px">status</span>
        <span id="statusBadge" class="badge collecting">idle</span>
        <span class="muted" id="sessionLabel" style="font-size:11px;margin-left:auto"></span>
      </div>
      <div class="slots" id="slots"></div>

      <div class="chat" id="chat"></div>

      <div class="samples" id="chatSamples"></div>
      <div class="row" style="margin-top:8px">
        <div><input type="text" id="msg" placeholder="Type a message, e.g. send 75 SAR to Mona" /></div>
        <div style="flex:0 0 auto"><button id="sendBtn">Send</button></div>
      </div>
      <div id="chatErr"></div>
    </section>

    <!-- Memory inspector / editor -->
    <section class="card">
      <h2>Memory <span class="ep">GET/PUT/DELETE /memory/{user}</span>
        <button class="ghost sm" id="refreshMem" style="margin-left:auto">Refresh</button>
      </h2>

      <h3 style="font-size:13px;margin:4px 0 0;color:var(--muted)">Learned habits</h3>
      <div class="kv" id="habits"><div class="muted" style="grid-column:1/-1">—</div></div>

      <hr />

      <h3 style="font-size:13px;margin:0 0 0;color:var(--muted)">Shortcuts</h3>
      <div class="list" id="shortcuts"></div>

      <hr />
      <h3 style="font-size:13px;margin:0 0 10px;color:var(--muted)">Add / update a shortcut</h3>
      <div class="row">
        <div><label for="scName">name</label><input type="text" id="scName" placeholder="rent" /></div>
        <div><label for="scAmount">amount</label><input type="text" id="scAmount" placeholder="5000" /></div>
        <div><label for="scCurrency">currency</label><input type="text" id="scCurrency" placeholder="EGP" /></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label for="scRecipient">recipient</label><input type="text" id="scRecipient" placeholder="Landlord" /></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><button id="saveSc">Save shortcut</button></div>
      </div>
      <div id="memMsg"></div>
    </section>
  </main>

      <footer>
        FastAPI + Memory Brain · <a href="/docs">OpenAPI docs</a>
      </footer>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    function userId() { return $("userId").value.trim() || "demo"; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    const CHAT_SAMPLES = [
      { t: "hi" }, { t: "thanks" },
      { t: "send 75 to Mona" }, { t: "pay rent" }, { t: "yes" }, { t: "no" },
      { t: "حوّل 100 إلى محمد", rtl: true },
      { t: "pay my STC bill 778899 amount 320" },
      { t: "pay 320 electricity bill 778899" },
      { t: "I want to pay my internet bill" },
      { t: "ادفع فاتورة الكهرباء 778899 بمبلغ 320", rtl: true },
      { t: "1" }, { t: "2" },
    ];

    async function api(path, opts) {
      opts = opts || {};
      const headers = Object.assign({}, opts.headers || {});
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = body && body.error ? body.error.message : (body && body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : ("HTTP " + res.status));
        throw new Error(msg);
      }
      return body;
    }

    async function checkHealth() {
      try { const h = await api("/health"); $("healthDot").className = "dot ok"; $("healthText").textContent = "API online · v" + (h.version || "?"); }
      catch { $("healthDot").className = "dot bad"; $("healthText").textContent = "API offline"; }
    }

    function addMsg(role, text, meta) {
      const d = document.createElement("div");
      d.className = "msg " + role;
      d.setAttribute("dir", "auto");
      d.textContent = text;
      if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
      $("chat").appendChild(d);
      $("chat").scrollTop = $("chat").scrollHeight;
      return d;
    }

    function highlightFlagged(node, text, terms) {
      if (!node || !terms || !terms.length) return;
      const safe = terms.map(t => String(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).filter(Boolean);
      if (!safe.length) return;
      const re = new RegExp("(" + safe.join("|") + ")", "gi");
      node.innerHTML = esc(text).replace(re, '<span class="flag">$1</span>');
    }

    function renderStatus(status, pending) {
      const b = $("statusBadge");
      b.className = "badge " + (status || "collecting");
      b.textContent = status || "idle";
    }

    function renderSlots(slots, pending) {
      const isBill = slots && (slots.biller || slots.reference_number);
      const order = isBill
        ? ["biller", "reference_number", "amount", "currency"]
        : ["amount", "currency", "recipient", "source_account"];
      $("slots").innerHTML = order.map(k => {
        const v = slots && slots[k];
        const cls = v ? "filled" : (k === pending ? "pending" : "");
        return `<span class="slot ${cls}"><span class="k">${k}:</span> ${v ? esc(v) : "—"}</span>`;
      }).join("");
    }

    async function send(text) {
      text = (text != null ? text : $("msg").value).trim();
      if (!text) return;
      $("chatErr").innerHTML = "";
      const userNode = addMsg("user", text);
      $("msg").value = "";
      $("sendBtn").disabled = true;
      try {
        const payload = { text, user_id: userId() };
        if (sessionId) payload.session_id = sessionId;
        const r = await api("/conversation/text", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        sessionId = r.session_id;
        $("sessionLabel").textContent = "session " + (sessionId || "").slice(0, 8);
        renderStatus(r.status, r.pending_slot);
        renderSlots(r.slots, r.pending_slot);
        highlightFlagged(userNode, text, r.flagged_terms);
        let meta = r.status + (r.pending_slot ? " · need: " + r.pending_slot : "");
        if (r.flagged_terms && r.flagged_terms.length) meta = "flagged · " + meta;
        addMsg("bot", r.reply, meta);
        if (r.status === "completed") { loadMemory(); }
      } catch (err) {
        $("chatErr").innerHTML = `<div class="err">${esc(err.message)}</div>`;
      } finally {
        $("sendBtn").disabled = false;
        $("msg").focus();
      }
    }

    function newSession() {
      sessionId = null;
      $("chat").innerHTML = "";
      $("sessionLabel").textContent = "";
      renderStatus("idle");
      renderSlots({});
      $("msg").focus();
    }

    async function loadMemory() {
      try {
        const m = await api("/memory/" + encodeURIComponent(userId()));
        const h = m.habits || {};
        const rc = h.recipient_counts || {};
        const rcStr = Object.keys(rc).length ? Object.entries(rc).map(([k, v]) => `${esc(k)}×${v}`).join(", ") : "—";
        const amts = (h.common_amounts || []).length ? h.common_amounts.map(esc).join(", ") : "—";
        $("habits").innerHTML = `
          <div class="k">total transfers</div><div class="v">${h.total_transfers ?? 0}</div>
          <div class="k">favorite recipient</div><div class="v" dir="auto">${h.favorite_recipient ? esc(h.favorite_recipient) : '<span class="muted">—</span>'}</div>
          <div class="k">preferred currency</div><div class="v">${h.preferred_currency ? esc(h.preferred_currency) : '<span class="muted">—</span>'}</div>
          <div class="k">last recipient</div><div class="v" dir="auto">${h.last_recipient ? esc(h.last_recipient) : '<span class="muted">—</span>'}</div>
          <div class="k">recipient counts</div><div class="v" dir="auto">${rcStr}</div>
          <div class="k">common amounts</div><div class="v">${amts}</div>`;
        const sc = m.shortcuts || [];
        $("shortcuts").innerHTML = sc.length ? sc.map(s => `
          <div class="item">
            <span dir="auto"><span class="name">${esc(s.name)}</span> — ${s.amount ? esc(s.amount) : "?"} ${s.currency ? esc(s.currency) : ""} to ${s.recipient ? esc(s.recipient) : "?"}</span>
            <button class="sm danger" data-name="${esc(s.name)}">Delete</button>
          </div>`).join("") : '<div class="muted">No shortcuts yet.</div>';
        $("shortcuts").querySelectorAll("button[data-name]").forEach(btn => {
          btn.onclick = () => deleteShortcut(btn.getAttribute("data-name"));
        });
      } catch (err) {
        $("habits").innerHTML = `<div class="err" style="grid-column:1/-1">${esc(err.message)}</div>`;
      }
    }

    async function saveShortcut() {
      const name = $("scName").value.trim();
      if (!name) { $("memMsg").innerHTML = '<div class="err">Shortcut needs a name.</div>'; return; }
      const payload = { name };
      const amount = $("scAmount").value.trim();
      if (amount) payload.amount = amount;
      const cur = $("scCurrency").value.trim();
      if (cur) payload.currency = cur;
      const rec = $("scRecipient").value.trim();
      if (rec) payload.recipient = rec;
      try {
        await api("/memory/" + encodeURIComponent(userId()) + "/shortcuts", {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        $("memMsg").innerHTML = `<div class="ok">Saved shortcut "${esc(name)}".</div>`;
        $("scName").value = $("scAmount").value = $("scCurrency").value = $("scRecipient").value = "";
        loadMemory();
      } catch (err) {
        $("memMsg").innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
    }

    async function deleteShortcut(name) {
      try {
        await api("/memory/" + encodeURIComponent(userId()) + "/shortcuts/" + encodeURIComponent(name), { method: "DELETE" });
        $("memMsg").innerHTML = `<div class="ok">Deleted "${esc(name)}".</div>`;
        loadMemory();
      } catch (err) {
        $("memMsg").innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
    }

    function renderChips() {
      $("chatSamples").innerHTML = "";
      CHAT_SAMPLES.forEach(s => {
        const b = document.createElement("button");
        b.className = "chip"; b.textContent = s.t;
        if (s.rtl) b.setAttribute("dir", "rtl");
        b.onclick = () => send(s.t);
        $("chatSamples").appendChild(b);
      });
    }

    $("sendBtn").onclick = () => send();
    $("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    $("newSession").onclick = newSession;
    $("refreshMem").onclick = loadMemory;
    $("saveSc").onclick = saveShortcut;
    $("userId").addEventListener("change", () => { newSession(); loadMemory(); });
    const qpUser = new URLSearchParams(location.search).get("user");
    if (qpUser) $("userId").value = qpUser;
    renderChips();
    renderStatus("idle");
    renderSlots({});
    checkHealth();
    loadMemory();
  </script>
</body>
</html>
