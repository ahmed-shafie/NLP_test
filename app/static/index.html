<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banking NLU Brain — Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 20px; margin: 0; }
    header .sub { color: var(--muted); font-size: 13px; }
    header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
    .dot.ok { background: var(--accent-2); }
    .dot.bad { background: var(--danger); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    .full { grid-column: 1 / -1; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .card h2 .ep { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--accent); background: var(--panel-2); padding: 2px 8px; border-radius: 6px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    textarea, input[type=text], input[type=number] {
      width: 100%; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      font-size: 14px; font-family: inherit; resize: vertical;
    }
    textarea { min-height: 60px; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 120px; }
    button {
      background: var(--accent); color: #04293a; border: none; border-radius: 8px;
      padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .chip {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip[dir=rtl] { font-size: 15px; }
    .result { margin-top: 14px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.transfer { background: rgba(34,197,94,.15); color: var(--accent-2); border: 1px solid rgba(34,197,94,.4); }
    .badge.fallback { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.4); }
    .badge.semantic { background: rgba(56,189,248,.15); color: var(--accent); border: 1px solid rgba(56,189,248,.4); }
    .badge.keyword { background: rgba(148,163,184,.15); color: var(--muted); border: 1px solid rgba(148,163,184,.4); }
    .badge.llm { background: rgba(168,85,247,.15); color: #c4b5fd; border: 1px solid rgba(168,85,247,.4); }
    .clarify { margin-top: 12px; background: rgba(168,85,247,.08); border: 1px solid rgba(168,85,247,.35); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .clarify .lbl { color: #c4b5fd; font-size: 12px; display: block; margin-bottom: 4px; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin-top: 12px; font-size: 14px; }
    .kv .k { color: var(--muted); }
    .kv .v { word-break: break-word; }
    .meter { background: var(--panel-2); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 4px; }
    .meter > span { display: block; height: 100%; background: var(--accent); }
    .list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .item .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .item .score { font-family: ui-monospace, monospace; color: var(--accent); font-size: 13px; }
    .muted { color: var(--muted); }
    pre.raw { background: #0b1220; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; max-height: 260px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Banking NLU Brain</h1>
    <span class="sub">Money-transfer simulator · English &amp; Arabic</span>
    <nav style="display:flex;gap:14px;font-size:13px">
      <a style="color:var(--accent)" href="/">Simulator</a>
      <a style="color:var(--muted)" href="/admin">Connections</a>
      <a style="color:var(--muted)" href="/admin/audit">Audit monitor</a>
    </nav>
    <span class="status"><span id="healthDot" class="dot"></span><span id="healthText">checking…</span></span>
  </header>

  <main>
    <!-- Parse -->
    <section class="card full">
      <h2>Parse utterance <span class="ep">POST /nlu/parse</span></h2>
      <label for="parseText">Type what the user said (English or Arabic)</label>
      <textarea id="parseText" placeholder="e.g. send 500 dollars to Ahmed">send 500 dollars to Ahmed</textarea>
      <label for="parseAccount" style="margin-top:10px">Destination account number (optional — resolves the beneficiary from the database)</label>
      <input id="parseAccount" type="text" placeholder="e.g. EG1003" />
      <div class="samples" id="parseSamples"></div>
      <div class="row" style="margin-top:12px">
        <button id="parseBtn">Analyze</button>
        <button class="ghost" id="parseClear">Clear</button>
      </div>
      <div class="result" id="parseResult"></div>
    </section>

    <!-- Similar -->
    <section class="card">
      <h2>Nearest examples <span class="ep">GET /nlu/similar</span></h2>
      <label for="simText">Utterance</label>
      <input type="text" id="simText" value="I want to send money to Sara" />
      <div class="row" style="margin-top:12px">
        <div style="max-width:90px">
          <label for="simK">k</label>
          <input type="number" id="simK" value="3" min="1" max="20" />
        </div>
        <div style="flex:0 0 auto"><button id="simBtn">Search</button></div>
      </div>
      <div class="result" id="simResult"></div>
    </section>

    <!-- Resolve -->
    <section class="card">
      <h2>Resolve contact <span class="ep">POST /contacts/resolve</span></h2>
      <label for="resName">Recipient name (try a Latin name → Arabic contact)</label>
      <input type="text" id="resName" value="Ahmed" />
      <div class="samples" id="resSamples"></div>
      <div class="row" style="margin-top:12px">
        <div style="max-width:90px">
          <label for="resK">top_k</label>
          <input type="number" id="resK" value="3" min="1" max="20" />
        </div>
        <div style="flex:0 0 auto"><button id="resBtn">Resolve</button></div>
      </div>
      <div class="result" id="resResult"></div>
    </section>
  </main>

  <footer>
    FastAPI + spaCy + Stanza + FAISS · <a style="color:var(--accent)" href="/docs">OpenAPI docs</a>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const PARSE_SAMPLES = [
      { t: "send 500 dollars to Ahmed" },
      { t: "transfer 1,500 EUR to Sara from my savings account" },
      { t: "حوّل ألف جنيه إلى محمد", rtl: true },
      { t: "ارسل ٥٠٠ ريال الى Ahmed", rtl: true },
      { t: "what is my account balance" },
    ];
    const RES_SAMPLES = [
      { t: "Ahmed" }, { t: "Mohamed" }, { t: "سارة", rtl: true }, { t: "Laila" },
    ];

    function pct(x) { return (x * 100).toFixed(1) + "%"; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
    function isRTL(s) { return /[\u0600-\u06FF]/.test(s); }

    function renderChips(container, samples, target) {
      container.innerHTML = "";
      samples.forEach(s => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = s.t;
        if (s.rtl) b.setAttribute("dir", "rtl");
        b.onclick = () => { target.value = s.t; target.dispatchEvent(new Event("input")); };
        container.appendChild(b);
      });
    }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : ("HTTP " + res.status));
      return body;
    }

    async function checkHealth() {
      try {
        const h = await api("/health");
        $("healthDot").className = "dot ok";
        $("healthText").textContent = "API online · v" + (h.version || "?");
      } catch (e) {
        $("healthDot").className = "dot bad";
        $("healthText").textContent = "API offline";
      }
    }

    function rawBlock(obj) {
      return `<details><summary>Raw JSON</summary><pre class="raw">${esc(JSON.stringify(obj, null, 2))}</pre></details>`;
    }

    async function doParse() {
      const text = $("parseText").value.trim();
      const account = $("parseAccount").value.trim();
      const out = $("parseResult");
      if (!text) { out.innerHTML = '<div class="err">Enter some text first.</div>'; return; }
      $("parseBtn").disabled = true; out.innerHTML = '<div class="muted">Analyzing…</div>';
      try {
        const payload = { text };
        if (account) payload.account_number = account;
        const r = await api("/nlu/parse", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const e = r.entities || {};
        const rr = r.resolved_recipient;
        const intentClass = r.intent === "transfer_money" ? "transfer" : "fallback";
        const recipientName = rr ? esc(rr.contact.name) : '<span class="muted">— none —</span>';
        const llmBadge = r.llm_assisted ? '<span class="badge llm" title="LiteLLM exception handler filled or corrected slots">LLM assisted</span>' : "";
        const benBadge = r.beneficiary_source
          ? `<span class="badge ${r.beneficiary_source === "database" ? "semantic" : "llm"}" title="How the beneficiary was resolved">beneficiary: ${esc(r.beneficiary_source)}</span>`
          : "";
        const b = r.resolved_beneficiary;
        const benBlock = b
          ? `<div class="kv" style="margin-top:10px">
               <div class="k">beneficiary</div><div class="v" dir="auto"><b>${esc(b.name)}</b></div>
               <div class="k">account</div><div class="v">${b.account ? esc(b.account) : '<span class="muted">null</span>'}</div>
               <div class="k">bank</div><div class="v" dir="auto">${b.bank ? esc(b.bank) : '<span class="muted">null</span>'}</div>
             </div>`
          : (account
              ? `<div class="clarify" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)"><span class="lbl" style="color:var(--warn)">account ${esc(account)} not found in database</span><span dir="auto">Delegated to the LLM (see clarification below).</span></div>`
              : "");
        const clarify = r.clarification ? `<div class="clarify"><span class="lbl">LLM clarification</span><span dir="auto">${esc(r.clarification)}</span></div>` : "";
        out.innerHTML = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span class="badge ${intentClass}">${esc(r.intent)}</span>
            <span class="badge ${esc(r.intent_source)}">${esc(r.intent_source)}</span>
            ${benBadge}
            ${llmBadge}
            <span class="muted">language: <b>${esc(r.language)}</b></span>
          </div>
          <div style="margin-top:10px">
            <label>confidence — ${pct(r.confidence)}</label>
            <div class="meter"><span style="width:${pct(r.confidence)}"></span></div>
          </div>
          <div class="kv">
            <div class="k">amount</div><div class="v">${e.amount ?? '<span class="muted">null</span>'}</div>
            <div class="k">currency</div><div class="v">${e.currency ?? '<span class="muted">null</span>'}</div>
            <div class="k">recipient</div><div class="v" dir="auto">${e.recipient ? esc(e.recipient) : '<span class="muted">null</span>'}</div>
            <div class="k">source account</div><div class="v">${e.source_account ?? '<span class="muted">null</span>'}</div>
            <div class="k">resolved contact</div><div class="v" dir="auto">${recipientName}${rr ? ` <span class="muted">(${esc(rr.contact.account || "")}, ${pct(rr.score)})</span>` : ""}</div>
          </div>
          ${benBlock}
          ${clarify}
          ${rawBlock(r)}`;
      } catch (err) {
        out.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      } finally {
        $("parseBtn").disabled = false;
      }
    }

    async function doSimilar() {
      const text = $("simText").value.trim();
      const k = parseInt($("simK").value, 10) || 3;
      const out = $("simResult");
      if (!text) { out.innerHTML = '<div class="err">Enter some text first.</div>'; return; }
      $("simBtn").disabled = true; out.innerHTML = '<div class="muted">Searching…</div>';
      try {
        const r = await api(`/nlu/similar?text=${encodeURIComponent(text)}&k=${k}`);
        if (!r.length) { out.innerHTML = '<div class="muted">No results (embedding model may be unavailable).</div>'; return; }
        out.innerHTML = '<div class="list">' + r.map(x => `
          <div class="item">
            <div class="top">
              <span dir="auto">${esc(x.text)}</span>
              <span class="score">${pct(x.score)}</span>
            </div>
            <div class="muted" style="font-size:12px;margin-top:4px">${esc(x.intent)}</div>
          </div>`).join("") + "</div>" + rawBlock(r);
      } catch (err) {
        out.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      } finally {
        $("simBtn").disabled = false;
      }
    }

    async function doResolve() {
      const name = $("resName").value.trim();
      const top_k = parseInt($("resK").value, 10) || 3;
      const out = $("resResult");
      if (!name) { out.innerHTML = '<div class="err">Enter a name first.</div>'; return; }
      $("resBtn").disabled = true; out.innerHTML = '<div class="muted">Resolving…</div>';
      try {
        const r = await api("/contacts/resolve", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, top_k }),
        });
        const m = r.matched;
        const matchedHtml = m
          ? `<div class="item"><div class="top"><span dir="auto"><b>${esc(m.contact.name)}</b> <span class="muted">${esc(m.contact.account || "")}</span></span><span class="score">${pct(m.score)}</span></div><div class="muted" style="font-size:12px;margin-top:4px">best match</div></div>`
          : '<div class="muted">No confident match.</div>';
        const cands = (r.candidates || []).map(c => `
          <div class="item"><div class="top"><span dir="auto">${esc(c.contact.name)} <span class="muted">${esc(c.contact.account || "")}</span></span><span class="score">${pct(c.score)}</span></div></div>`).join("");
        out.innerHTML = matchedHtml +
          '<label style="margin-top:14px">candidates</label><div class="list">' + cands + "</div>" + rawBlock(r);
      } catch (err) {
        out.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      } finally {
        $("resBtn").disabled = false;
      }
    }

    renderChips($("parseSamples"), PARSE_SAMPLES, $("parseText"));
    renderChips($("resSamples"), RES_SAMPLES, $("resName"));
    $("parseBtn").onclick = doParse;
    $("parseClear").onclick = () => { $("parseText").value = ""; $("parseAccount").value = ""; $("parseResult").innerHTML = ""; };
    $("simBtn").onclick = doSimilar;
    $("resBtn").onclick = doResolve;
    $("parseText").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") doParse(); });
    checkHealth();
    doParse();
  </script>
</body>
</html>
