<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banking NLU Brain — Active Learning</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .stat { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat .n { font-size: 22px; font-weight: 800; }
    .stat .l { font-size: 12px; color: var(--muted); }
    button { padding: 8px 14px; font-size: 13px; }
    select, input[type=text] { padding: 7px 10px; font-size: 13px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar select, .toolbar input[type=text] { width: auto; min-width: 160px; }
    .toolbar .spacer { flex: 1; }
    .item { margin-bottom: 10px; }
    .item .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0; border: none; background: none; }
    .item .utt { font-size: 15px; word-break: break-word; }
    .item .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .item .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .badge.pending { background: rgba(217,119,6,.12); color: var(--warn); border: 1px solid rgba(217,119,6,.35); }
    .badge.auto_approved { background: rgba(37,99,235,.12); color: var(--brand); border: 1px solid rgba(37,99,235,.35); }
    .badge.approved { background: rgba(5,150,105,.12); color: var(--good); border: 1px solid rgba(5,150,105,.35); }
    .badge.rejected { background: rgba(225,29,72,.12); color: var(--danger); border: 1px solid rgba(225,29,72,.35); }
    .item .badges { display: flex; gap: 6px; align-items: center; }
    .badge.risk-high { background: rgba(225,29,72,.12); color: var(--danger); border: 1px solid rgba(225,29,72,.35); }
    .badge.risk-medium { background: rgba(217,119,6,.12); color: var(--warn); border: 1px solid rgba(217,119,6,.35); }
    .badge.risk-low { background: rgba(100,116,139,.12); color: var(--muted); border: 1px solid rgba(100,116,139,.3); }
    .note { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="rail">
      <a class="logo" href="/assistant" title="Home">N</a>
      <div class="nav">
        <a class="ic" title="Assistant" href="/assistant">💬</a>
        <a class="ic" title="Brain (Developer mode)" href="/assistant?dev=1">🧠</a>
        <a class="ic" title="NLU Sandbox" href="/">🧪</a>
        <a class="ic" title="Insights" href="/brain/monitor">📊</a>
        <a class="ic active" title="Learning" href="/active-learning">🎓</a>
        <a class="ic" title="Connections" href="/admin">🔗</a>
        <a class="ic" title="Audit" href="/admin/audit">🛡️</a>
      </div>
      <div class="me" title="user"></div>
    </div>
    <div class="main">
      <div class="top">
        <div class="av">🎓</div>
        <div><div class="ttl">Active Learning</div><div class="sub">Review queue · nightly index hot-swap</div></div>
        <div class="pill" style="margin-left:auto"><span id="healthDot" class="dot"></span><span id="healthText">checking…</span></div>
      </div>

  <main class="content">
    <section class="card">
      <h2>Queue overview <span class="ep">GET /active-learning/stats</span></h2>
      <div class="stats" id="stats"><div class="note">Loading…</div></div>
      <div class="note" id="indexInfo" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h2>Review queue <span class="ep">GET /active-learning/queue</span></h2>
      <div class="toolbar">
        <label class="note" for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="">all</option>
          <option value="pending" selected>pending</option>
          <option value="auto_approved">auto_approved</option>
          <option value="approved">approved</option>
          <option value="rejected">rejected</option>
        </select>
        <button class="ghost" id="refreshBtn">Refresh</button>
        <div class="spacer"></div>
        <button class="ok" id="rebuildBtn" title="Rebuild + hot-swap the FAISS intent index now">Rebuild index now</button>
      </div>
      <div id="rebuildResult" class="note"></div>
      <div id="queue"><div class="note">Loading…</div></div>
    </section>
  </main>

      <footer>
        FastAPI + FAISS · <a href="/docs">OpenAPI docs</a>
      </footer>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const INTENTS = ["transfer_money", "fallback"];
    function esc(s) { return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
    function fmtTime(s) { if (!s) return "—"; try { return new Date(s).toLocaleString(); } catch { return s; } }

    async function api(path, opts) {
      opts = opts || {};
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const body = res.status === 204 ? null : await res.json();
      if (!res.ok) {
        const msg = body && body.error ? body.error.message : (body && body.detail ? JSON.stringify(body.detail) : ("HTTP " + res.status));
        throw new Error(msg);
      }
      return body;
    }

    async function checkHealth() {
      try { const h = await api("/health"); $("healthDot").className = "dot ok"; $("healthText").textContent = "API online · v" + (h.version || "?"); }
      catch { $("healthDot").className = "dot bad"; $("healthText").textContent = "API offline"; }
    }

    function statCard(n, l) { return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

    async function loadStats() {
      try {
        const s = await api("/active-learning/stats");
        $("stats").innerHTML =
          statCard(s.total, "total logged") + statCard(s.pending, "pending review") +
          statCard(s.auto_approved, "auto-approved") + statCard(s.approved, "approved") +
          statCard(s.rejected, "rejected") + statCard(s.learned_examples, "learned examples");
        const idx = s.index_loaded
          ? `Live index: <b>${s.index_base_examples}</b> base + <b>${s.index_learned_examples}</b> learned examples.`
          : "Semantic index not loaded (embedding model unavailable).";
        const nxt = s.next_rebuild_utc ? ` · Next nightly rebuild: <b>${fmtTime(s.next_rebuild_utc)}</b>` : "";
        const last = s.last_rebuild_at ? ` · Last rebuild: <b>${fmtTime(s.last_rebuild_at)}</b>` : "";
        $("indexInfo").innerHTML = idx + nxt + last;
      } catch (e) { $("stats").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    }

    function intentSelect(id, current) {
      const opts = INTENTS.map(i => `<option value="${i}" ${i === current ? "selected" : ""}>${i}</option>`).join("");
      return `<select id="${id}" title="Correct the label before approving">${opts}</select>`;
    }

    function caseItem(c) {
      const llm = c.llm_assisted ? '<span class="badge llm">LLM assisted</span>' : "";
      // The queue is served worst-first, so the badge explains the order.
      const p = c.priority || 0;
      const band = p >= 0.75 ? "high" : p >= 0.45 ? "medium" : "low";
      const risk = `<span class="badge risk-${band}" title="Review priority (1.00 = review first)">risk ${p.toFixed(2)}</span>`;
      const decided = c.status === "approved" || c.status === "rejected" || c.status === "auto_approved";
      const actions = decided
        ? `<span class="note">${c.reviewer ? "by " + esc(c.reviewer) + " · " : ""}${fmtTime(c.reviewed_at)}</span>`
        : `${intentSelect("intent-" + c.id, c.predicted_intent)}
           <button class="ok" onclick="decide(${c.id}, 'approve')">Approve</button>
           <button class="danger" onclick="decide(${c.id}, 'reject')">Reject</button>`;
      return `<div class="item" id="case-${c.id}">
          <div class="top">
            <span class="utt" dir="auto">${esc(c.text)}</span>
            <span class="badges">${risk}<span class="badge ${c.status}">${c.status}</span></span>
          </div>
          <div class="meta">
            <span>#${c.id}</span>
            <span>predicted: <b>${esc(c.predicted_intent)}</b>${c.corrected_intent ? " → <b>" + esc(c.corrected_intent) + "</b>" : ""}</span>
            <span>confidence: <b>${(c.confidence * 100).toFixed(1)}%</b></span>
            <span>source: ${esc(c.intent_source)}</span>
            <span>lang: ${esc(c.language)}</span>
            ${llm}
            <span>${fmtTime(c.created_at)}</span>
          </div>
          ${c.clarification ? `<div class="meta" dir="auto">clarification: ${esc(c.clarification)}</div>` : ""}
          <div class="actions">${actions}</div>
        </div>`;
    }

    async function loadQueue() {
      const status = $("statusFilter").value;
      try {
        const rows = await api(`/active-learning/queue?limit=200${status ? "&status=" + status : ""}`);
        $("queue").innerHTML = rows.length ? rows.map(caseItem).join("") : '<div class="note">No cases in this view.</div>';
      } catch (e) { $("queue").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    }

    async function decide(id, action) {
      const sel = $("intent-" + id);
      const body = action === "approve" ? { corrected_intent: sel ? sel.value : null, reviewer: "web" } : { reviewer: "web" };
      try {
        await api(`/active-learning/${id}/${action}`, { method: "POST", body: JSON.stringify(body) });
        await Promise.all([loadStats(), loadQueue()]);
      } catch (e) { alert("Failed: " + e.message); }
    }

    async function rebuild() {
      $("rebuildBtn").disabled = true; $("rebuildResult").textContent = "Rebuilding index…";
      try {
        const r = await api("/active-learning/rebuild", { method: "POST", body: "{}" });
        $("rebuildResult").innerHTML = `<span style="color:${r.ok ? "var(--accent-2)" : "var(--warn)"}">${esc(r.message)}</span>`;
        await loadStats();
      } catch (e) { $("rebuildResult").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
      finally { $("rebuildBtn").disabled = false; }
    }

    function loadAll() { checkHealth(); loadStats(); loadQueue(); }
    $("refreshBtn").onclick = loadQueue;
    $("statusFilter").onchange = loadQueue;
    $("rebuildBtn").onclick = rebuild;
    loadAll();
  </script>
</body>
</html>
