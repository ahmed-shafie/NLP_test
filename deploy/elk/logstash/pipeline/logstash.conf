# Logstash pipeline for Banking NLU audit events.
# Receives JSON-lines audit events over TCP and forwards them to Elasticsearch.
# Used when the app runs with NLU_AUDIT_SINK=logstash.

input {
  tcp {
    port  => 50000
    codec => json_lines
  }
}

filter {
  # Use the app-provided epoch-millis timestamp as the event time.
  if [timestamp] {
    date {
      match  => ["timestamp", "UNIX_MS"]
      target => "@timestamp"
    }
  }
  mutate {
    add_field => { "[pipeline]" => "logstash" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nlu-audit"
  }
}
