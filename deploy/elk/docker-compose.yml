# Local ELK stack for Banking NLU audit observability.
#
#   docker compose -f deploy/elk/docker-compose.yml up -d
#
# Then point the app at it (defaults already match):
#   NLU_ELK_ENABLED=true
#   NLU_AUDIT_SINK=elasticsearch          # or "logstash"
#   NLU_ELASTICSEARCH_URL=http://localhost:9200
#   NLU_LOGSTASH_HOST=localhost
#   NLU_LOGSTASH_PORT=50000
#
# Kibana: http://localhost:5601   Elasticsearch: http://localhost:9200
# Security is disabled for local development only — do not use this as-is in prod.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: nlu-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: nlu-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.monitoring.enabled=false
    ports:
      - "50000:50000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: nlu-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  esdata:
